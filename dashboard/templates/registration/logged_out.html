<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تم تسجيل الخروج - نظام المراقبة الأمني</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(120deg, #e0e7ff 0%, #f8fafc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logout-card {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(80, 80, 180, 0.08);
            text-align: center;
            max-width: 400px;
        }
        .logout-card h1 {
            color: #4b2996;
            margin-bottom: 1rem;
        }
        .logout-card p {
            color: #6b7280;
            margin-bottom: 2rem;
        }
        .login-btn {
            background: linear-gradient(120deg, #7c3aed, #6366f1);
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 12px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            color: white;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <h1>تم تسجيل الخروج بنجاح</h1>
        <p>شكراً لاستخدام نظام المراقبة الأمني</p>
        <a href="{% url 'login' %}" class="login-btn">
            تسجيل الدخول مرة أخرى
        </a>
    </div>
</body>
</html>
