{% extends 'dashboard/base.html' %}
{% load static %}

{% block title %}المساعد الذكي{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">المساعد الذكي</h4>
                </div>
                <div class="card-body">
                    <div id="chat-messages" class="chat-messages mb-3" style="height: 400px; overflow-y: auto;">
                        <!-- Messages will be added here dynamically -->
                    </div>
                    <form id="chat-form" class="mt-3">
                        <div class="input-group">
                            <input type="text" id="message-input" class="form-control" placeholder="اكتب رسالتك هنا..." required>
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-paper-plane"></i> إرسال
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const chatForm = document.getElementById('chat-form');
    const messageInput = document.getElementById('message-input');
    const chatMessages = document.getElementById('chat-messages');

    function addMessage(message, isUser = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${isUser ? 'user-message' : 'bot-message'} mb-2 p-2 rounded`;
        messageDiv.style.backgroundColor = isUser ? '#e3f2fd' : '#f5f5f5';
        messageDiv.style.marginLeft = isUser ? 'auto' : '0';
        messageDiv.style.marginRight = isUser ? '0' : 'auto';
        messageDiv.style.maxWidth = '80%';
        messageDiv.textContent = message;
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const message = messageInput.value.trim();
        if (message) {
            addMessage(message, true);
            messageInput.value = '';
            
            // Send message to server
            fetch('/chatbot/send_message/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify({ message: message })
            })
            .then(response => response.json())
            .then(data => {
                addMessage(data.response);
            })
            .catch(error => {
                console.error('Error:', error);
                addMessage('عذراً، حدث خطأ في الاتصال. يرجى المحاولة مرة أخرى.');
            });
        }
    });

    // Helper function to get CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    // Add initial welcome message
    addMessage('مرحباً! أنا المساعد الذكي. كيف يمكنني مساعدتك اليوم؟');
});
</script>

<style>
.chat-messages {
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 10px;
}

.message {
    word-wrap: break-word;
}

.user-message {
    text-align: left;
}

.bot-message {
    text-align: right;
}
</style>
{% endblock %}
